[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "router-demo"
version = "1.0.0"
description = "CLI that routes software quality questions by complexity (SQA demo)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Mauro" }]
dependencies = [
    "jinja2>=3.1.6",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "pydantic>=2",
    "python-dotenv",
    "rich",
]

[project.scripts]
router-demo = "router_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
router_demo = ["presentation/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PL", "SIM", "ERA", "T20", "S", "BLE", "PERF", "RET", "ARG", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
