name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LLM_BACKEND: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip install ruff==0.17.3 bandit==1.9.4 pip-audit==2.10.1
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -r src -q
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest --cov=router_demo --cov-report=term-missing --cov-fail-under=70
